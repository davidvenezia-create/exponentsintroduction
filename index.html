<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exponent Lab</title>
<meta name="description" content="Interactive exponents practice in English and Spanish: build powers, grow them, and use them in expressions.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14213D">
<meta property="og:title" content="Exponent Lab">
<meta property="og:description" content="See what exponents mean, then use them.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314213D'/%3E%3Ctext x='12' y='46' font-family='Arial' font-weight='900' font-size='40' fill='%23ffffff'%3E2%3C/text%3E%3Ctext x='38' y='30' font-family='Arial' font-weight='900' font-size='24' fill='%23FFD23F'%3E3%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#14213D; --paper:#F2F7FC; --grid:#DCE6F2; --card:#FFFFFF; --line:#C3D2E6; --muted:#53637C;
  --base:#1D4ED8; --base-soft:#DDE7FF; --exp:#C2185B; --exp-soft:#FCE0EC; --val:#0B7F5F; --val-soft:#D8F3EA;
  --mark:#FFD23F; --mark-soft:#FFF3C4; --bad:#B42318; --bad-soft:#FDE7E4; --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font:17px/1.5 "Avenir Next","Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
}
h1,h2,h3,p{margin:0}
h2{font-size:1.2rem;line-height:1.25;margin-bottom:10px}
h3{font-size:1.02rem;line-height:1.3;margin-bottom:8px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--base);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding:16px 16px 48px}
.muted{color:var(--muted)}
.lead{font-size:1.08rem;margin-bottom:12px}
[hidden]{display:none!important}

/* header */
.masthead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;gap:14px;align-items:center}
.logo{display:grid;place-items:center;width:64px;height:64px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);font-size:2rem}
h1{font-size:clamp(1.7rem,5vw,2.6rem);line-height:1;font-weight:900;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:4px}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;padding:8px 16px;cursor:pointer;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* student bar */
.who{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.who label{display:flex;flex-direction:column;font-size:.85rem;font-weight:700;color:var(--muted);gap:2px}
.who input{border:2px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;width:180px;color:var(--ink);font-weight:600}
.who input#sPeriod{width:90px}
#whoNote{font-size:.9rem;flex:1 1 220px}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700;white-space:nowrap}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab:hover:not(.on){border-color:var(--ink)}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card.inner{background:#FAFCFF;margin:14px 0 0}
.card.stage{border-color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.rowhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.rowhead h2,.rowhead h3{margin:0}

/* buttons */
.btn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:700;min-height:44px}
.btn:hover:not(:disabled){background:var(--mark-soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:#22335c}
.btn.small{padding:5px 12px;min-height:36px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default}
.chipbtn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;min-height:40px}
.chipbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chipbtn.kb{color:var(--base);border-color:var(--base)} .chipbtn.ke{color:var(--exp);border-color:var(--exp)}
.chipbtn.kp{color:var(--val);border-color:var(--val)} .chipbtn.kf{color:var(--ink);border-color:var(--ink)}
.storypick,.defrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}

/* powers: base = blue, exponent = magenta, result = green */
.pow{display:inline-flex;align-items:flex-start;font-weight:800;line-height:1}
.pow .b{color:var(--base)}
.pow sup.e{color:var(--exp);font-size:.62em;line-height:1;margin-left:.06em;margin-top:-.06em;vertical-align:baseline}
.pow.big{font-size:5rem}
.pow button{background:transparent;border:0;padding:0 .04em;cursor:pointer;font:inherit;border-radius:8px}
.pow button.b{color:var(--base)} .pow button.e{color:var(--exp)}
.pow.big button:hover,.pow.tapp button:hover{background:var(--mark-soft)}
.pow.tapp{font-size:4rem}
.pow.tapp button{border:3px dashed var(--line);padding:0 .15em;margin:0 .04em}
.pow.tapp sup.e button{min-width:52px;min-height:52px}
.pow.tapp button.right{border-color:var(--val);background:var(--val-soft)}
.val{color:var(--val);font-weight:900}
.k b,.kb{color:var(--base)} .ke{color:var(--exp)} .kp{color:var(--val)}
strong.kb{color:var(--base)} strong.ke{color:var(--exp)} strong.kp{color:var(--val)} strong.kf{color:var(--ink)}

/* steppers */
.ctrls{display:flex;flex-wrap:wrap;gap:14px 28px;margin:6px 0 4px}
.stepper{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.slabel{font-weight:800}
.stepper.sb .slabel{color:var(--base)} .stepper.se .slabel{color:var(--exp)}
.sctl{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.sbtn{width:52px;height:52px;border:0;background:transparent;font-size:1.6rem;font-weight:800;cursor:pointer}
.sbtn:hover{background:var(--mark-soft)}
.sctl output{min-width:52px;text-align:center;font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums}
.stepper.sb output{color:var(--base)} .stepper.se output{color:var(--exp)}

/* build tab */
.bigpow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 26px;margin:18px 0 6px}
.bigpow .bp{font-size:clamp(4.2rem,15vw,7rem);line-height:1}
.bigpow .eq{font-size:clamp(2.4rem,8vw,4rem);font-weight:900;color:var(--ink)}
.bigpow .val{background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 .1em}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{border-radius:10px;padding:5px 11px;font-size:.92rem}
.tag.tb{background:var(--base-soft);color:var(--base)} .tag.te{background:var(--exp-soft);color:var(--exp)}
.say{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.saytxt{font-size:1.35rem;font-weight:800}
.alt{margin-top:2px}
.chain{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:1.6rem;font-weight:900;margin:6px 0 8px}
.chip{display:inline-grid;place-items:center;min-width:46px;height:46px;padding:0 10px;border:3px solid var(--base);background:var(--base-soft);color:var(--base);border-radius:12px;animation:pop .22s ease-out}
.times{color:var(--muted);font-weight:700}
.warn{background:var(--mark-soft);border-left:5px solid var(--mark);padding:8px 12px;border-radius:8px;font-size:.98rem}
.ladder{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:76px minmax(120px,1.1fr) minmax(80px,1.6fr) auto;gap:6px 12px;align-items:center}
.lrow .lp{font-size:1.5rem}
.lrow .lm{font-variant-numeric:tabular-nums}
.lrow .lv{font-weight:900;color:var(--val);min-width:60px;text-align:right;font-variant-numeric:tabular-nums}
.lbar,.gbar{display:block;height:16px;background:var(--base-soft);border-radius:8px;overflow:hidden}
.lbar i,.gbar i{display:block;height:100%;background:var(--base);border-radius:8px}
.lrow.hid{visibility:hidden}
.lrow.flash{animation:flash 1s ease-out}
.blocks{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 6px}
.lay{display:grid;gap:2px;padding:4px;background:var(--base-soft);border-radius:8px}
.lay i{background:var(--base);border-radius:2px}
.lay.s1 i{background:#4C78EE} .lay.s2 i{background:#86A6FA}
.cap{color:var(--muted);font-size:.95rem}

/* words tab */
.anat{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.anat-pow{padding:6px 14px}
.defbox{background:#FAFCFF;border:2px dashed var(--line);border-radius:12px;padding:12px 14px;min-height:76px;display:flex;align-items:center}
.tablewrap{overflow-x:auto}
.saytable{border-collapse:collapse;width:100%}
.saytable th{text-align:left;font-size:.9rem;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 10px}
.saytable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.saytable td:first-child{font-size:1.5rem}
.alt2{display:block;font-size:.88rem;color:var(--muted)}
.chaincell{font-weight:800;white-space:nowrap}
.cb{color:var(--base)}

/* quiz engine */
.quiz{min-height:200px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qcount{font-weight:800;color:var(--muted)}
.dots{display:inline-flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.done{background:var(--ink)} .dots i.cur{background:var(--mark)}
.qprompt{font-size:1.2rem;font-weight:700;margin-bottom:12px}
.chainbig,.exprbig{font-size:2.3rem;font-weight:800;display:inline-block;margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.opt{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;font-size:1.15rem;font-weight:700;min-height:56px;text-align:center;display:flex;align-items:center;justify-content:center}
.opt:hover:not(:disabled){background:var(--mark-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.75}
.opt.right{border-color:var(--val);background:var(--val-soft);opacity:1}
.tapbox{padding:4px 0 10px}
.numrow,.pairrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.numin{border:2px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:1.3rem;font-weight:800;width:150px;font-variant-numeric:tabular-nums}
.numin.small{width:86px}
.lblb,.lble{display:flex;flex-direction:column;font-size:.9rem;font-weight:800;gap:2px}
.lblb{color:var(--base)} .lble{color:var(--exp)}
.lblb input{border-color:var(--base)} .lble input{border-color:var(--exp)}
.calc{font-size:1.4rem;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.fb{margin-top:12px;border-radius:12px;padding:10px 14px;border-left:6px solid transparent}
.fb:empty{display:none}
.fb.good{background:var(--val-soft);border-color:var(--val)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.hint{background:var(--mark-soft);border-color:var(--mark)}
.fb.reveal{background:var(--base-soft);border-color:var(--base)}
.qactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.arrow{color:var(--muted);margin:0 4px}
.sum{text-align:center;padding:10px 0}
.bigstars{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0;font-size:1.7rem;color:#E0A100}
.sum .qactions{justify-content:center}
.lvlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.lvl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px solid var(--ink);background:#fff;border-radius:var(--r);padding:14px 16px;cursor:pointer}
.lvl:hover{background:var(--mark-soft)}
.lvlnum{font-size:2.2rem;font-weight:900;color:var(--exp);line-height:1}
.lvlname{font-weight:800;font-size:1.1rem}
.lvldesc{color:var(--muted)}

/* grow tab */
.storytext{margin-top:4px}
.ghead{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ghead small{font-size:1rem;font-weight:700;color:var(--muted)}
.sliderlab{display:flex;align-items:center;gap:12px;font-weight:800;margin:6px 0 12px}
.sliderlab input{flex:1;accent-color:var(--exp);height:32px}
.growlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.grow-row{display:grid;grid-template-columns:78px 82px minmax(60px,1fr) minmax(70px,auto);gap:4px 10px;align-items:center;padding:4px 8px;border-radius:10px}
.grow-row.cur{background:var(--mark-soft);outline:2px solid var(--mark)}
.grow-row.future{opacity:.5}
.gp{font-size:1.3rem}
.gv{font-weight:900;color:var(--val);text-align:right;font-variant-numeric:tabular-nums}
.gv small{color:var(--muted);font-weight:700}
.gbar.add i{background:#8896AD} .gbar.add{background:#E8EDF4}
.gbar.mul i{background:var(--exp)} .gbar.mul{background:var(--exp-soft)}
.cmp2{display:grid;gap:12px}
.cmprow{display:grid;gap:4px}
.cl{font-weight:700}

/* rules tab */
.zlist{list-style:none;margin:8px 0;padding:0;display:grid;gap:2px}
.zrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 12px;border-radius:10px;background:#FAFCFF;border:2px solid var(--line)}
.zrow.ask{border-color:var(--exp);background:var(--exp-soft)}
.zrow.solved{border-color:var(--val);background:var(--val-soft)}
.zp{font-size:1.7rem;min-width:84px}
.zeq{font-size:1.4rem;font-weight:900;font-variant-numeric:tabular-nums}
.znote{color:var(--muted);font-size:.92rem}
.zdiv{color:var(--exp);font-weight:800;padding-left:34px;font-size:.95rem}
.tenrow{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:10px 0 4px}
.tennum{letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tennum .z{color:var(--exp);background:var(--exp-soft);border-radius:6px;padding:0 3px;margin:0 1px}
.eqs{color:var(--muted)}
.chal summary{cursor:pointer;font-weight:800;font-size:1.1rem}
.chal[open] summary{margin-bottom:8px}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:12px 0}
.cmpcell{border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.cmph{font-size:2rem;font-weight:800;margin-bottom:4px}
.cmpb{font-size:1.2rem;font-weight:800}

/* order tab */
.rank{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 10px;counter-reset:r}
.rank li{background:#FAFCFF;border:2px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:700}
.rank li.r2{border-color:var(--exp);color:var(--exp)}
.rank b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.85rem;margin-right:6px}
.exprbox{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 0 14px;min-height:80px}
.tn{padding:0 2px}
.top{color:var(--ink)}
.grp{color:var(--muted);font-weight:500}
.tk{cursor:pointer;border-radius:10px;padding:2px 8px;border:3px solid transparent;background:#F3F6FB}
.tk:hover{background:var(--mark-soft);border-color:var(--mark)}
.tk.op{min-width:44px;text-align:center}
.pending{background:var(--mark)!important;border-radius:10px;padding:2px 8px}
.hint.tk,.tk.hint{border-color:var(--mark);box-shadow:0 0 0 5px rgba(255,210,63,.55);animation:glow 1s ease-in-out 3}
.oprompt{font-weight:700;color:var(--muted)}
.answerline{font-size:1.6rem;font-weight:900}
.starz{color:#E0A100;margin-left:8px}

@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{from{background:var(--mark)}to{background:transparent}}
@keyframes glow{50%{box-shadow:0 0 0 9px rgba(255,210,63,.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  .app{padding:12px 12px 40px}
  .anat{grid-template-columns:1fr}
  .lrow{grid-template-columns:64px 1fr auto}
  .lrow .lbar{grid-column:1 / -1;grid-row:2}
  .grow-row{grid-template-columns:62px 70px 1fr auto}
  .pow.big{font-size:4rem}
  .who input,.who input#sPeriod{width:100%}
  .who label{flex:1 1 120px}
}

</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="brand">
      <span class="logo" aria-hidden="true"><span class="pow"><span class="b">2</span><sup class="e">3</sup></span></span>
      <div><h1 data-i18n="title">Exponent Lab</h1><p class="sub" data-i18n="subtitle"></p></div>
    </div>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="es" aria-pressed="false">Espa&ntilde;ol</button>
    </div>
  </header>

  <section class="who" aria-label="Student">
    <label><span data-i18n="whoName">Name</span><input id="sName" type="text" autocomplete="off" data-i18n-ph="namePh"></label>
    <label><span data-i18n="whoPeriod">Period</span><input id="sPeriod" type="text" autocomplete="off" data-i18n-ph="periodPh"></label>
    <button type="button" class="btn small" id="sReset" data-i18n="whoNew">New student</button>
    <p id="whoNote" class="muted"></p>
  </section>

  <nav id="tabs" class="tabs" role="tablist"></nav>

  <main>
    <section class="panel" id="p-build" role="tabpanel" aria-labelledby="tab-build"></section>
    <section class="panel" id="p-words" role="tabpanel" aria-labelledby="tab-words" hidden></section>
    <section class="panel" id="p-grow" role="tabpanel" aria-labelledby="tab-grow" hidden></section>
    <section class="panel" id="p-rules" role="tabpanel" aria-labelledby="tab-rules" hidden></section>
    <section class="panel" id="p-order" role="tabpanel" aria-labelledby="tab-order" hidden></section>
    <section class="panel" id="p-practice" role="tabpanel" aria-labelledby="tab-practice" hidden></section>
  </main>
</div>

<script>
(function(){
'use strict';
/* =====================================================================
   Text in English and Spanish. Keys must match in both languages.
   ===================================================================== */
var I18N = {
en: {
  title: "Exponent Lab",
  subtitle: "See what exponents mean, then use them.",
  whoName: "Name", whoPeriod: "Period", namePh: "Your name", periodPh: "e.g. 3", whoNew: "New student",
  whoNone: "Type your name first so your teacher can see your work.", whoHas: "Your teacher can see your work.",
  tabBuild: "Build it", tabWords: "Say it", tabGrow: "Watch it grow", tabRules: "Special cases", tabOrder: "Order of operations", tabPractice: "Practice",
  base: "Base", exponent: "Exponent", baseDef: "the number you multiply", expDef: "how many times the base is a factor", listen: "Listen",

  buildLead: "Pick a base and an exponent. The exponent tells you how many copies of the base to multiply.",
  factorsTitle: "Factors of {b}: {e}", ladderTitle: "Multiply by {b}, again and again", watch: "Watch it build", oneFactor: "just {b}",
  blocksTitle: "Picture it", noBlocks: "Exponents bigger than 3 are too big for a flat picture. Use the ladder above.",
  capE1: "{b} blocks in a row. One factor of {b}.", capE2: "{b} rows of {b} blocks = {v} blocks", capE3: "{b} layers, each with {b} rows of {b} blocks = {v} blocks",
  noteE1: "An exponent of 1 means one factor: {b}¹ is just {b}.",
  noteSame: "{pow} means {b} used {e} times as a factor. Here it happens to equal {b} × {e} = {prod}, but that is luck. It is not the rule.",
  noteNot: "{pow} is NOT {b} × {e} = {prod}. It is {b} multiplied {e} times = {val}.",
  alsoSay: "You can also say: {alt}",

  anatomyTitle: "Parts of a power", anatomyPrompt: "Tap the base, the exponent, or a word below.",
  term_b: "base", term_e: "exponent", term_p: "power", term_f: "factor",
  defBase: "The big number. It is the number you multiply.",

var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var rnd = function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); };
var pick = function (arr) { return arr[rnd(0, arr.length - 1)]; };
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(0, i); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function on(root, sel, evt, fn) { $$(sel, root).forEach(function (el) { el.addEventListener(evt, function (e) { fn(el, e); }); }); }

var NB = ' ';
function fmt(n) {
  var s = String(Math.abs(n));
  if (s.length >= 5) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, NB);
  return (n < 0 ? '−' : '') + s;
}
function parseNum(s) {
  s = String(s).replace(/[\s,.  ]/g, '').replace(/[−–]/g, '-');
  return /^-?\d+$/.test(s) ? parseInt(s, 10) : NaN;
}
function stars(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }

var LOGGER = {
  url: "https://script.google.com/macros/s/AKfycbwV7Hd_JRL54Xbxm2tiAFx3kWm_WFO5nxSotzCD0PiAuEYtx4Z3AlTQ3UwwJYrsOKS6/exec",

};
var student = { name: '', period: '' };
var SKEY = 'exponent-lab-student-v1';
try {
  var savedStudent = JSON.parse(localStorage.getItem(SKEY) || 'null');
  if (savedStudent) { student.name = savedStudent.name || ''; student.period = savedStudent.period || ''; }
} catch (e) {}
function saveStudent() { try { localStorage.setItem(SKEY, JSON.stringify(student)); } catch (e) {} }
var hasLoggedStart = false;
function sendLog(payload) {
  if (!LOGGER.enabled || !LOGGER.url) return;
  try {
    var p = fetch(LOGGER.url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    if (p && p.catch) p.catch(function () {});
  } catch (e) { /* never block a student's work because logging failed */ }
}
/* logEvent(event, section, item, correct, text, stars)
   section = where in the app (e.g. practice-L2-value); item = the exact problem (e.g. 3^4)
   correct = true/false/null; text = error label or note; stars = 0-3 or null */
function logEvent(ev, section, item, correct, text, starCount) {
  try {
    var base = { app: LOGGER.app, student: ((student.name || '').trim() || 'unknown'), period: ((student.period || '').trim()) };
    if (!hasLoggedStart && ev !== 'start') { hasLoggedStart = true; sendLog(Object.assign({}, base, { event: 'start', section: '', item: '' })); }
    if (ev === 'start') hasLoggedStart = true;
    var x = { event: ev, section: section || '', item: item == null ? '' : String(item), text: text == null ? '' : String(text) };
    if (correct != null) x.correct = correct ? 1 : 0;
    if (starCount != null) x.stars = starCount;
    x.station = x.section; x.stageIndex = x.item; /* aliases used by older apps in the suite */
    sendLog(Object.assign({}, base, x));
  } catch (e) {}
}

    if (Z.shown < 5) Z.shown++; else Z.zero = true;
    updateZero();
    if (Z.zero) { var zi = $('#zIn'); if (zi) try { zi.focus(); } catch (e) {} }
  });
  var zc = $('#zCheck'); if (zc) {
    var run = function () {
      var v = parseNum($('#zIn').value); if (v !== v) { $('#zFb').className = 'fb bad'; $('#zFb').innerHTML = t('typeNumber'); return; }
      Z.tries++;
      var ok = v === 1, d = ok ? 'correct' : (v === 0 ? 'zero' : (v === Z.b ? 'chose-base' : 'other'));
      logEvent('zero-power', 'rules-zero', Z.b + '^0', ok, d + ' | ' + v, ok ? Math.max(1, 4 - Z.tries) : null);
      if (ok) { Z.solved = true; updateZero(); $('#zFb').className = 'fb good'; $('#zFb').innerHTML = '<strong>' + t('right') + '</strong> ' + t('zeroRule', { b: Z.b }); }
      else { $('#zFb').className = 'fb bad'; $('#zFb').innerHTML = d === 'zero' ? t('zeroNotZero', { b: Z.b }) : t('zeroTry', { b: Z.b }); try { $('#zIn').focus(); $('#zIn').select(); } catch (e) {} }
    };
    zc.addEventListener('click', run);
    $('#zIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
  }
}
function tenHTML() {
  var n = TZ.n, s = fmt(Math.pow(10, n)), out = '';
  for (var i = 0; i < s.length; i++) out += s.charAt(i) === '0' ? '<span class="z">0</span>' : s.charAt(i);
  return '<div class="tenrow">' + powHTML(10, n) + ' <span class="eqs">=</span> <span class="tennum">' + out + '</span></div><p class="muted">' + t('tenZeros', { n: n }) + '</p>';
}
function chalHTML() {
  var b = CH.b, e = CH.e, neg = Math.pow(-b, e), mn = -Math.pow(b, e), parts = [];
  for (var i = 0; i < e; i++) parts.push('(−' + b + ')');
  return '<div class="cmpgrid"><div class="cmpcell"><div class="cmph">' + powHTML('(−' + b + ')', e) + '</div><div class="cmpb">' + parts.join(' ' + MIX + ' ') + ' = <span class="val">' + fmt(neg) + '</span></div><p class="muted">' + t('negWhy1') + '</p></div>' +
    '<div class="cmpcell"><div class="cmph">−' + powHTML(b, e) + '</div><div class="cmpb">−(' + chainText(b, e) + ') = <span class="val">' + fmt(mn) + '</span></div><p class="muted">' + t('negWhy2') + '</p></div></div>' +
    '<p class="warn">' + t('negRule') + '</p>';
}
function renderRules(host) {
  host.innerHTML =
    '<div class="card"><h2>' + t('zeroTitle') + '</h2><p>' + t('zeroLead') + '</p>' +
    '<div class="storypick" role="group" aria-label="' + t('base') + '">' + [2, 3, 5, 10].map(function (x) {
      return '<button type="button" class="chipbtn' + (x === Z.b ? ' on' : '') + '" data-zb="' + x + '" aria-pressed="' + (x === Z.b) + '">' + t('base') + ' ' + x + '</button>';
    }).join('') + '</div><div id="zOut"></div><div id="zCtl" class="qactions"></div><div class="fb" id="zFb" role="status" aria-live="polite"></div></div>' +
    '<div class="card"><h2>' + t('tenTitle') + '</h2>' + stepperHTML('tn', t('exponent'), 'se', TZ.n) + '<div id="tOut"></div></div>' +
    '<div class="card"><h2>' + t('oneTitle') + '</h2><p>' + t('oneText', { ex: powHTML(1, 5) + ' = 1 ' + MIX + ' 1 ' + MIX + ' 1 ' + MIX + ' 1 ' + MIX + ' 1 = 1' }) + '</p></div>' +
    '<details class="card chal" id="chal"' + (CH.open ? ' open' : '') + '><summary>' + t('chalTitle') + '</summary><p>' + t('chalLead') + '</p>' +
    '<div class="ctrls">' + stepperHTML('cb', t('base'), 'sb', CH.b) + stepperHTML('ce', t('exponent'), 'se', CH.e) + '</div><div id="cOut"></div></details>';
  on(host, '[data-zb]', 'click', function (el) {
    Z.b = +el.getAttribute('data-zb'); Z.shown = 1; Z.zero = false; Z.solved = false; Z.tries = 0; renderRules(host);
    logEvent('zero-base', 'rules-zero', Z.b + '^0', null, '');
  });
  on(host, '.sbtn', 'click', function (el) {
    var k = el.getAttribute('data-k'), d = +el.getAttribute('data-d');
    if (k === 'tn') { TZ.n = Math.max(1, Math.min(9, TZ.n + d)); $('#v-tn').textContent = TZ.n; $('#tOut').innerHTML = tenHTML(); }
    if (k === 'cb') { CH.b = Math.max(2, Math.min(9, CH.b + d)); $('#v-cb').textContent = CH.b; $('#cOut').innerHTML = chalHTML(); }
    if (k === 'ce') { CH.e = Math.max(2, Math.min(5, CH.e + d)); $('#v-ce').textContent = CH.e; $('#cOut').innerHTML = chalHTML(); }
  });
  $('#chal').addEventListener('toggle', function () { CH.open = this.open; if (this.open) logEvent('challenge-open', 'rules-negatives', '', null, ''); });
  $('#tOut').innerHTML = tenHTML();
  $('#cOut').innerHTML = chalHTML();
  updateZero();
}

/* =====================================================================
   TAB 5 - Order of operations (click what to do first)
   ===================================================================== */
var OR = { level: 1, expr: null, work: null, pending: null, hint: null, errors: 0, tries: 0, done: false };

function newOrder() {
  var x = makeExpr(OR.level);
  OR.expr = x; OR.work = cloneList(x.tokens); normalize(OR.work);
  OR.pending = null; OR.hint = null; OR.errors = 0; OR.tries = 0; OR.done = false;
  logEvent('order-new', 'order-L' + OR.level, tokText(x.tokens), null, '');
}
function orderFb(kind, html) { var el = $('#oFb'); el.className = 'fb ' + kind; el.innerHTML = html; }
function drawOrder() {
  var box = $('#oExpr');
  var act = findAction(OR.work);
  box.innerHTML = tokHTML(OR.work, { live: !OR.done && !OR.pending, pending: OR.pending ? OR.pending.list[OR.pending.idx].id : null, hint: OR.hint });
  var step = $('#oStep');
  if (OR.done) {
    var stars3 = OR.errors === 0 ? 3 : (OR.errors <= 2 ? 2 : 1);
    step.innerHTML = '<div class="answerline">' + t('oAnswer') + ' <span class="val">' + OR.work[0].v + '</span> <span class="starz">' + stars(stars3) + '</span></div>' +
      '<div class="qactions"><button type="button" class="btn primary" id="oNew">' + t('oNext') + '</button></div>';
    $('#oNew').addEventListener('click', function () { newOrder(); drawOrder(); orderFb('', ''); });
    try { $('#oNew').focus(); } catch (e) {}
    return;
  }
  if (OR.pending) {
    var a = OR.pending;
    step.innerHTML = '<div class="numrow"><span class="calc">' + actDesc(a) + ' =</span><input id="oIn" class="numin small" type="text" inputmode="numeric" autocomplete="off" aria-label="' + t('answerLabel') + '"><button type="button" class="btn primary" id="oCheck">' + t('check') + '</button></div>';
    var run = function () { checkOrderValue(); };
    $('#oCheck').addEventListener('click', run);
    $('#oIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
    try { $('#oIn').focus(); } catch (e) {}
    return;
  }
  step.innerHTML = '<p class="oprompt">' + (act ? t('oClick') : '') + '</p>';
}
function clickOrder(id) {
  if (OR.done || OR.pending) return;
  var act = findAction(OR.work), hit = locate(OR.work, id);
  if (!act || !hit) return;
  OR.hint = null;
  var target = act.list[act.idx];
  var item = tokText(OR.expr.tokens), sec = 'order-L' + OR.level;
  if (hit.list === act.list && hit.idx === act.idx) {
    OR.pending = act;
    logEvent('step-click', sec, item, true, act.kind);
    orderFb('good', '<strong>' + t('right') + '</strong> ' + t('oWhy_' + act.kind));
    drawOrder();
    return;
  }
  OR.errors++;
  var clicked = hit.list[hit.idx], diag;
  if (hit.list !== act.list) diag = 'skipped-parentheses';
  else if (act.kind === 'pow') diag = clicked.t === 'o' ? 'skipped-exponent' : 'wrong-order-left-to-right';
  else if (act.kind === 'mul') diag = clicked.t === 'o' && clicked.v !== MIX ? 'skipped-multiplication' : 'wrong-order-left-to-right';
  else diag = 'wrong-order-left-to-right';
  logEvent('step-click', sec, item, false, diag);
  orderFb('bad', t('oFb_' + diag));
}
function checkOrderValue() {
  var act = OR.pending, v = parseNum($('#oIn').value), want = actValue(act);
  var item = tokText(OR.expr.tokens), sec = 'order-L' + OR.level;
  if (v !== v) { orderFb('bad', t('typeNumber')); return; }
  OR.tries++;
  var ok = v === want;
  logEvent('step-value', sec, actDesc(act).replace(/<[^>]+>/g, ''), ok, ok ? 'correct' : 'wrong | ' + v);
  if (!ok) {
    OR.errors++;
    var m = act.kind === 'pow' ? t('oValPow', { chain: chainHTML(act.list[act.idx].b.v, act.list[act.idx].e) }) : t('oValOp');
    orderFb('bad', m);
    try { $('#oIn').focus(); $('#oIn').select(); } catch (e) {}
    return;
  }
  applyAct(act, want); normalize(OR.work);
  OR.pending = null; OR.tries = 0;
  if (OR.work.length === 1 && OR.work[0].t === 'n') {
    OR.done = true;
    var s3 = OR.errors === 0 ? 3 : (OR.errors <= 2 ? 2 : 1);
    logEvent('problem-complete', sec, item, true, 'errors:' + OR.errors, s3);
    orderFb('good', '<strong>' + t('right') + '</strong> ' + t('oDone'));
  } else orderFb('', '');
  drawOrder();
}
function renderOrder(host) {
  if (!OR.expr) newOrder();
  host.innerHTML =
    '<div class="card"><p class="lead">' + t('orderLead') + '</p>' +
    '<ol class="rank"><li><b>1</b> ' + t('rank1') + '</li><li class="r2"><b>2</b> ' + t('rank2') + '</li><li><b>3</b> ' + t('rank3') + '</li><li><b>4</b> ' + t('rank4') + '</li></ol>' +
    '<div class="storypick" role="group" aria-label="' + t('level') + '">' + [1, 2, 3].map(function (l) {
      return '<button type="button" class="chipbtn' + (l === OR.level ? ' on' : '') + '" data-l="' + l + '" aria-pressed="' + (l === OR.level) + '">' + t('level') + ' ' + l + '</button>';
    }).join('') + '</div></div>' +
    '<div class="card stage"><div class="exprbox" id="oExpr" aria-live="polite"></div><div id="oStep"></div><div class="fb" id="oFb" role="status" aria-live="polite"></div>' +
    '<div class="qactions"><button type="button" class="btn" id="oHint">💡 ' + t('oShow') + '</button><button type="button" class="btn" id="oSkip">' + t('oNew') + '</button></div></div>';
  on(host, '[data-l]', 'click', function (el) { OR.level = +el.getAttribute('data-l'); newOrder(); renderOrder(host); });
  $('#oHint').addEventListener('click', function () {
    if (OR.done || OR.pending) return;
    var a = findAction(OR.work); if (!a) return;
    OR.hint = a.list[a.idx].id;
    logEvent('hint', 'order-L' + OR.level, tokText(OR.expr.tokens), null, a.kind);
    orderFb('hint', t('oHint_' + a.kind));
    drawOrder();
  });
  $('#oSkip').addEventListener('click', function () { newOrder(); drawOrder(); orderFb('', ''); });
  var box = $('#oExpr');
  box.addEventListener('click', function (e) { var tk = e.target.closest('.tk'); if (tk) clickOrder(+tk.getAttribute('data-id')); });
  box.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var tk = e.target.closest('.tk'); if (tk) { e.preventDefault(); clickOrder(+tk.getAttribute('data-id')); }
  });
  drawOrder();
}

/* =====================================================================
   TAB 6 - Practice
   ===================================================================== */
var PR = { level: 0 };
var LEVELS = [
  { id: 1, key: 'lvl1', make: practiceL1 },
  { id: 2, key: 'lvl2', make: practiceL2 },
  { id: 3, key: 'lvl3', make: practiceL3 }
];
function renderPractice(host) {
  if (!PR.level) {
    host.innerHTML = '<div class="card"><p class="lead">' + t('practiceLead') + '</p><div class="lvlgrid">' + LEVELS.map(function (l) {
      return '<button type="button" class="lvl" data-lv="' + l.id + '"><span class="lvlnum">' + l.id + '</span><span class="lvlname">' + t(l.key) + '</span><span class="lvldesc">' + t(l.key + 'd') + '</span></button>';
    }).join('') + '</div></div>';
    on(host, '[data-lv]', 'click', function (el) { PR.level = +el.getAttribute('data-lv'); logEvent('level', 'practice-L' + PR.level, '', null, ''); renderPractice(host); });
    return;
  }
  var lv = LEVELS[PR.level - 1];
  host.innerHTML = '<div class="card"><div class="rowhead"><h2>' + t('level') + ' ' + lv.id + ': ' + t(lv.key) + '</h2><button type="button" class="btn small" id="pBack">' + t('chooseLevel') + '</button></div><div id="pQuiz" class="quiz"></div></div>';
  $('#pBack').addEventListener('click', function () { PR.level = 0; renderPractice(host); });
  runSet($('#pQuiz'), lv.make(), {
    section: 'practice-L' + lv.id,
    actions: function (st) {
      var a = [{ label: t('again'), cls: 'primary', fn: function () { renderPractice(host); } }];
      if (lv.id < 3) a.push({ label: t('nextLevel'), fn: function () { PR.level = lv.id + 1; renderPractice(host); } });
      a.push({ label: t('chooseLevel'), fn: function () { PR.level = 0; renderPractice(host); } });
      return a;
    }
  });
}

/* =====================================================================
   App shell: tabs, language, student bar
   ===================================================================== */
var TABS = [
  { id: 'build', key: 'tabBuild', render: renderBuild },
  { id: 'words', key: 'tabWords', render: renderWords },
  { id: 'grow', key: 'tabGrow', render: renderGrow },
  { id: 'rules', key: 'tabRules', render: renderRules },
  { id: 'order', key: 'tabOrder', render: renderOrder },
  { id: 'practice', key: 'tabPractice', render: renderPractice }
];
var dirty = {};
function drawTabs() {
  $('#tabs').innerHTML = TABS.map(function (tb) {
    var on_ = tb.id === S.tab;
    return '<button type="button" role="tab" class="tab' + (on_ ? ' on' : '') + '" id="tab-' + tb.id + '" aria-selected="' + on_ + '" aria-controls="p-' + tb.id + '" data-tab="' + tb.id + '">' + t(tb.key) + '</button>';
  }).join('');
  on($('#tabs'), '.tab', 'click', function (el) { showTab(el.getAttribute('data-tab'), true); });
}
function showTab(id, user) {
  S.tab = id; clearTimers();
  if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  TABS.forEach(function (tb) {
    var p = $('#p-' + tb.id);
    p.hidden = tb.id !== id;
    if (tb.id === id) { p.innerHTML = ''; tb.render(p); } else p.innerHTML = '';
  });
  drawTabs();
  if (user) logEvent('tab', id, '', null, '');
}
function applyStatic() {
  $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
  $$('[data-i18n-ph]').forEach(function (el) { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
  document.documentElement.setAttribute('lang', S.lang);
  $$('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === S.lang)); });
  updateWho();
}
function setLang(l, user) {
  S.lang = l;
  try { localStorage.setItem(LKEY, l); } catch (e) {}
  applyStatic(); showTab(S.tab, false);
  if (user) logEvent('language', '', l, null, '');
}
function initApp() {
  $('#sName').value = student.name; $('#sPeriod').value = student.period;
  $('#sName').addEventListener('input', function () { student.name = this.value; saveStudent(); updateWho(); });
  $('#sPeriod').addEventListener('input', function () { student.period = this.value; saveStudent(); });
  $('#sReset').addEventListener('click', function () {
    student.name = ''; student.period = ''; saveStudent();
    $('#sName').value = ''; $('#sPeriod').value = '';
    hasLoggedStart = false; PR.level = 0; OR.expr = null; GR.n = 3; newPredict(); Z.shown = 1; Z.zero = false; Z.solved = false;
    updateWho(); showTab(S.tab, false);
    try { $('#sName').focus(); } catch (e) {}
  });
  on(document, '.lang button', 'click', function (el) { setLang(el.getAttribute('data-lang'), true); });
  newPredict();
  applyStatic();
  showTab('build', false);
}
initApp();

})();
